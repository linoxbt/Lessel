app:
  id: ari:cloud:ecosystem::app/00000000-0000-0000-0000-000000000000 # replaced by `forge register`
  runtime:
    name: nodejs22.x

modules:
  llm:
    - key: lessel-llm
      model:
        - claude

  trigger:
    - key: jira-events
      function: onJiraEvent
      events:
        - avi:jira:created:issue
        - avi:jira:assigned:issue
        - avi:jira:updated:issue
        - avi:jira:created:issuelink
        - avi:jira:deleted:issuelink
        - avi:jira:commented:issue
    - key: bitbucket-events
      function: onBitbucketEvent
      events: # [verify] exact Bitbucket event names
        - avi:bitbucket:created:pullrequest
        - avi:bitbucket:updated:pullrequest
        - avi:bitbucket:fulfilled:pullrequest
        - avi:bitbucket:updated:pullrequest-reviewer-status
        - avi:bitbucket:push:repository
        - avi:bitbucket:completed:deployment
    - key: confluence-events
      function: onConfluenceEvent
      events:
        - avi:confluence:created:page
        - avi:confluence:updated:page
        - avi:confluence:created:comment

    - key: lifecycle
      function: onLifecycle
      events:
        - avi:forge:installed:app
        - avi:forge:upgraded:app

  scheduledTrigger:
    - key: outcome-resolver
      function: resolveOutcomes
      interval: hour

  consumer:
    - key: lessel-jobs
      queue: lessel-jobs
      resolver:
        function: jobs
        method: run

  bitbucket:mergeCheck:
    - key: lessel-gate
      function: mergeGate
      name: Lessel autonomy gate
      description: Applies Lessel's decision for this agent and task to the PR.
      triggers:
        - on-code-pushed
        - on-reviewer-status-changed
        - on-merge

  jira:workflowValidator:
    - key: lessel-ready-to-merge
      name: Lessel ready-to-merge check
      description: Blocks Ready to merge until the PR meets Lessel's decision.
      function: validateReadyToMerge
    - key: lessel-agent-start
      name: Lessel agent start check
      description: Blocks an agent from starting work it is not eligible for.
      function: validateAgentStart

  jira:projectPage:
    - key: lessel-board
      title: Lessel
      resource: board
      render: native
      resolver:
        function: uiResolver

  jira:issuePanel:
    - key: lessel-fit
      title: Lessel
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      resource: panel
      render: native
      resolver:
        function: uiResolver

  jira:adminPage:
    - key: lessel-admin
      title: Lessel settings
      resource: admin
      render: native
      resolver:
        function: uiResolver

  action:
    - key: rank-assignees
      name: Rank assignees
      function: rankAssignees
      actionVerb: GET
      description: Rank eligible AI agents and the team for a Jira work item by Lessel record.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: "Jira work item key, e.g. PAY-212"
    - key: explain-record
      name: Explain record
      function: explainRecord
      actionVerb: GET
      description: Explain an agent's earned level, holds and evidence for a task shape.
      inputs:
        agent:
          title: Agent
          type: string
          required: true
          description: "Agent display name"
        shape:
          title: Shape
          type: string
          required: false
          description: "Shape id, e.g. ledger/schema-migration; omit for all"
    - key: get-my-scope
      name: Get my scope
      function: getMyScope
      actionVerb: GET
      description: Return the calling agent's earned level and eligibility for every task shape.
      inputs:
        includeHolds:
          title: Include holds
          type: boolean
          required: false
          description: "Include probation and review holds"
    - key: check-ticket-fit
      name: Check ticket fit
      function: checkTicketFit
      actionVerb: GET
      description: Tell the calling agent whether it may work an item, and under what conditions.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: "Jira work item key"
    - key: declare-context
      name: Declare context
      function: declareContext
      actionVerb: CREATE
      description: Attest, before shipping, that the calling agent read one source while working an item.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: "Work item the caller is assigned to or has a PR on"
        sourceUrl:
          title: Source URL
          type: string
          required: true
          description: "Confluence page or Jira item URL"
        sourceVersion:
          title: Source version
          type: integer
          required: false
          description: "Page version number if known"
        readAt:
          title: Read at
          type: string
          required: false
          description: "ISO-8601 time the source was read"
    - key: check-context
      name: Check context
      function: checkContext
      actionVerb: GET
      description: Check whether a source is safe for the calling agent to use.
      inputs:
        sourceUrl:
          title: Source URL
          type: string
          required: true
          description: "Confluence page or Jira item URL"

  rovo:skill:
    - key: route-work
      source:
        dir: skills/route-work
      dependencies:
        tools:
          - rank-assignees
          - explain-record

  rovo:agent:
    - key: lessel-dispatcher
      name: Lessel Dispatcher
      description: Recommends which eligible AI agent, or the team, should take a work item.
      prompt: >
        You are Lessel Dispatcher. You recommend which eligible AI agent, or the team, should take a
        Jira work item, using only the evidence Lessel's actions return. Use the route-work skill.
        Never name or rank individual people. Quote numbers exactly as the actions return them.
      conversationStarters:
        - Who should take this ticket?
        - Can Brook be trusted with schema migrations?
      skills:
        - route-work
      actions:
        - rank-assignees
        - explain-record

  rovo:mcp:
    - key: lessel-mcp
      name: Lessel
      tools:
        - get-my-scope
        - check-ticket-fit
        - explain-record
        - declare-context
        - check-context

  function:
    - key: onJiraEvent
      handler: index.onJiraEvent
    - key: onBitbucketEvent
      handler: index.onBitbucketEvent
    - key: onConfluenceEvent
      handler: index.onConfluenceEvent
    - key: resolveOutcomes
      handler: index.resolveOutcomes
    - key: onLifecycle
      handler: index.onLifecycle
    - key: jobs
      handler: index.jobs
    - key: mergeGate
      handler: index.mergeGate
    - key: validateReadyToMerge
      handler: index.validateReadyToMerge
    - key: validateAgentStart
      handler: index.validateAgentStart
    - key: uiResolver
      handler: index.uiResolver
    - key: rankAssignees
      handler: index.rankAssignees
    - key: explainRecord
      handler: index.explainRecord
    - key: getMyScope
      handler: index.getMyScope
    - key: checkTicketFit
      handler: index.checkTicketFit
    - key: declareContext
      handler: index.declareContext
    - key: checkContext
      handler: index.checkContext

resources:
  - key: board
    path: src/frontend/board.jsx
  - key: panel
    path: src/frontend/panel.jsx
  - key: admin
    path: src/frontend/admin.jsx

permissions:
  external:
    fetch:
      backend:
        # Qwen via Fortytwo (settings.ai.provider = "qwen"). Ticket and page text is sent there, so inScopeEUD is true.
        # Remove this entry (and use provider "forge") to restore Runs on Atlassian eligibility.
        - address: https://api.fortytwo.network
          inScopeEUD: true
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - read:pullrequest:bitbucket
    - write:pullrequest:bitbucket
    - read:repository:bitbucket
    - read:pipeline:bitbucket
    - read:confluence-content.summary
    - read:confluence-content.all
    - read:page:confluence
    - write:page:confluence
    - write:confluence-content     # quarantine: labels and read restrictions
    - write:comment:confluence     # quarantine: footer comment
    - read:graph:issue:jira
    - read:graph:commit:external
    - read:graph:pull-request:external
    - read:graph:deployment:external
