app:
  id: ari:cloud:ecosystem::app/e42e10ed-bb5d-4185-850a-744a12e7f736
  runtime:
    name: nodejs22.x

modules:
  trigger:
    - key: bitbucket-events
      function: onEvent
      events:
        - avi:bitbucket:created:pullrequest
        - avi:bitbucket:updated:pullrequest
        - avi:bitbucket:fulfilled:pullrequest
        - avi:bitbucket:updated:pullrequest-reviewer-status
        - avi:bitbucket:push:repository
        - avi:bitbucket:completed:deployment

  bitbucket:mergeCheck:
    - key: lessel-gate
      function: mergeCheck
      name: Lessel autonomy gate
      description: Applies Lessel's decision for this agent and task to the PR.
      triggers:
        - on-code-pushed
        - on-reviewer-status-changed
        - on-merge

  # The paired Lessel site calls this, signed, to make the Bitbucket REST calls it needs (reads, PR comments).
  webtrigger:
    - key: bitbucket-proxy
      function: bitbucketProxy
      response:
        type: dynamic

  # Workspace settings → Lessel: pair this workspace with one Lessel site.
  bitbucket:workspaceSettingsMenuPage:
    - key: lessel-link
      title: Lessel
      resource: settings
      render: native
      resolver:
        function: settingsResolver

  function:
    - key: settingsResolver
      handler: index.settingsResolver
    - key: bitbucketProxy
      handler: index.bitbucketProxy
    - key: onEvent
      handler: index.onEvent
    - key: mergeCheck
      handler: index.mergeCheck

resources:
  - key: settings
    path: src/frontend/settings.jsx

permissions:
  scopes:
    - storage:app                   # this workspace's link to its Lessel site
    - read:pullrequest:bitbucket
    - read:repository:bitbucket
    - read:pipeline:bitbucket
    - write:pullrequest:bitbucket   # Lessel's PR notices
  external:
    fetch:
      backend:
        # The paired Lessel site's web trigger (from the pairing code).
        - address: "*.hello.atlassian-dev.net"
